name: Feature request
description: Suggest a new command or behaviour
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This bot is intentionally narrow in scope. Please describe your idea — if it's a good fit, we can discuss it before you write any code.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the bot to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?
